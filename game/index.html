<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A midnight soba stall game: pull noodles, boil them, add toppings and serve night-shift regulars before the clock runs out.">
<title>Soba After Midnight — pull, boil and serve soba to the night shift</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #141b33;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
  }
  #wrap {
    width: min(100vw, calc(100vh * 1280 / 720));
    aspect-ratio: 1280 / 720;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: auto;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
